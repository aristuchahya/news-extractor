[project]
name = "news-extractor"
version = "0.1.0"
description = "Service to extract main article content from news websites given a URL"
authors = [
    { name = "ArisuChah", email = "namikazeuzumaki43@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "trafilatura>=1.12.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "lxml>=5.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
